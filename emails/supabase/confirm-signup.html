<title>Confirm your email for CineSpace</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;padding:32px;font-size:16px;line-height:1.55;">
<tr><td>
<p style="margin:0 0 16px;">Hi there,</p>
<p style="margin:0 0 16px;">Confirm your email address to finish setting up your account.</p>
<p style="margin:24px 0 8px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;border-radius:999px;background:#f5551d;color:#ffffff;text-decoration:none;font-weight:700;">Confirm email</a></p>
<p style="margin:0 0 16px;font-size:12px;color:#71717a;word-break:break-all;">{{ .ConfirmationURL }}</p>
<p style="margin:0 0 16px;">The link works for 24 hours. If you didn't create a CineSpace account, ignore this email.</p>
</td></tr>
</table>
</td></tr>
</table>
